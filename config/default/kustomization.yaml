kind: Kustomization

# We use a custom namespace for the PGO
namespace: op-dev-postgres-operator

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: pgo
    app.kubernetes.io/version: 6.0.0
- includeSelectors: true
  includeTemplates: true
  pairs:
    postgres-operator.crunchydata.com/control-plane: postgres-operator

resources:
- ../crd
- ../rbac/cluster
- ../manager

components:
- ../components/images-by-tag

# We set a specific image for the operator
images:
- name: postgres-operator
  newName: registry.developers.crunchydata.com/crunchydata/postgres-operator
  newTag: ubi9-6.0.0-0

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pgo
    spec:
      template:
        spec:
          tolerations:
          - key: "node-operator"
            value: "true"
            operator: "Equal"
            effect: "NoSchedule"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                  - key: cloud.google.com/compute-class
                    operator: In
                    values:
                    - ci-compute-class-normal
          containers:
          - name: operator
            env:
            - name: PGO_FEATURE_GATES
              value: ""
            # Add low resource limits
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                cpu: 25m
                memory: 50Mi
              
